<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensFill" x1="16" y1="14" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9EDCFF"></stop>
      <stop offset="100%" stop-color="#6BBEFF"></stop>
    </linearGradient>
  </defs>

  <!-- Lens -->
  <circle cx="26" cy="26" r="16" fill="url(#lensFill)" stroke="#2D7DD2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></circle>

  <!-- Glossy highlight -->
  <path d="M18.5 18.5
       C20 15.8 22.8 14 26 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65"></path>

  <ellipse cx="33" cy="19" rx="3.2" ry="1.8" fill="#FFFFFF" opacity="0.35" transform="rotate(28 33 19)"></ellipse>

  <!-- Plus -->
  <path d="M26 20V32" stroke="#32C36C" stroke-width="3" stroke-linecap="round"></path>
  <path d="M20 26H32" stroke="#32C36C" stroke-width="3" stroke-linecap="round"></path>

  <!-- Handle -->
  <path d="M37.3 37.3L49.5 49.5" stroke="#4F5D75" stroke-width="6" stroke-linecap="round"></path>

  <!-- Handle connector -->
  <circle cx="37.3" cy="37.3" r="3" fill="#4F5D75"></circle>
</svg>